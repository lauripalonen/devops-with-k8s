apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: cached-image
          persistentVolumeClaim:
            claimName: image-claim
      containers:
        - name: todo-app
          image: palolaur/todo-app:2.6
          envFrom:
            - configMapRef:
                name: todo-app-configmap
          volumeMounts:
            - name: cached-image
              mountPath: /app/files
