apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: cached-image
          persistentVolumeClaim:
            claimName: image-claim
      containers:
        - name: todo-app
          image: palolaur/todo-app:2.2
          env:
            - name: PORT
              value: "3002"
            - name: IMAGE_STORAGE
              value: "/app/files"
            - name: TODO_SERVICE_URL
              value: "http://todo-backend-service:3003"
          volumeMounts:
            - name: cached-image
              mountPath: /app/files
