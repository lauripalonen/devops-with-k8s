apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
    spec:
      containers:
        - name: todo-backend
          image: palolaur/todo-backend:2.4
          env:
            - name: PORT
              value: "3003"
            - name: HOSTNAME
              value: "0.0.0.0"
