apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
    spec:
      containers:
        - name: todo-backend
          image: palolaur/todo-backend:2.9
          envFrom:
            - configMapRef:
                name: todo-backend-configmap
            - secretRef:
                name: psql-credentials
          env:
            - name: POSTGRES_HOST
              value: psql-svc
            - name: POSTGRES_PORT
              value: "5432"
