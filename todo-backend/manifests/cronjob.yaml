apiVersion: batch/v1
kind: CronJob
metadata:
  name: scheduled-task
  namespace: project
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: article-getter
              image: palolaur/article-getter:1.0
              env:
                - name: API_URL
                  value: "http://todo-backend-service:3003/todos"
          restartPolicy: OnFailure
