apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: psql-stset
  namespace: project
spec:
  serviceName: psql-svc
  replicas: 1
  selector:
    matchLabels:
      app: psql-server
  template:
    metadata:
      labels:
        app: psql-server
    spec:
      containers:
        - name: psql
          image: postgres:19
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: psql-credentials
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: psql-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: psql-credentials
                  key: POSTGRES_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: psql-data-storage
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: psql-data-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 100Mi
