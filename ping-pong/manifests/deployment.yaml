apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: exercises
  name: ping-pong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      #volumes:
      #  - name: shared-logs
      #    persistentVolumeClaim:
      #      claimName: logger-claim
      containers:
        - name: ping-pong
          image: palolaur/pingpong:2.7
          env:
            - name: POSTGRES_HOST
              value: psql-svc
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: psql-credentials
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: psql-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: psql-credentials
                  key: POSTGRES_PASSWORD
          #volumeMounts:
          #  - name: shared-logs
          #    mountPath: /usr/src/app/files
